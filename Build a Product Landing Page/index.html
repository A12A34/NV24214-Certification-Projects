<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Product Landing</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="header">
    <img id="header-img" src="https://via.placeholder.com/120x40?text=Logo" alt="logo">
    <nav id="nav-bar">
      <a class="nav-link" href="#features">Features</a>
      <a class="nav-link" href="#pricing">Pricing</a>
      <a class="nav-link" href="#contact">Contact</a>
    </nav>
  </header>

  <section id="hero">
    <h1>Our Product</h1>
    <p>Simple product landing page to collect emails.</p>
  </section>

  <section id="features">
    <h2>Features</h2>
    <p>Fast, simple, reliable.</p>
  </section>

  <section id="pricing">
    <h2>Pricing</h2>
    <p>Choose a plan that fits.</p>
  </section>

  <section id="contact">
    <h2>Contact</h2>
    <iframe id="video" src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="product video" allowfullscreen></iframe>

    <form id="form" action="https://www.freecodecamp.org/email-submit" method="POST">
      <label for="email">Subscribe</label>
      <input id="email" name="email" type="email" placeholder="Enter your email" required>
      <input id="submit" type="submit" value="Send">
    </form>
  </section>

</body>
</html>
