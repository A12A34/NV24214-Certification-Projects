<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1 id="title">Survey</h1>
    <p id="description">this survey form.</p>
    <form id="survey-form">
        <label for="name" id="name-label">Name:</label>
        <input type="text" id="name" placeholder="enter name" required>
        <label for="email" id="email-label">Email:</label>
        <input type="email" id="email" placeholder="enter email" required>
        <label for="number" id="number-label">Age (1-100):</label>
        <input type="number" id="number" min="1" max="100" placeholder="enter age" >
        <select id="dropdown">
            <option value="option1">Option 1</option>
            <option value="option2">Option 2</option>
        </select>
        <input type="radio" name="radio-group" value="radio1"> Radio 1
        <input type="radio" name="radio-group" value="radio2"> Radio 2
        <input type="checkbox" name="checkbox-group" value="checkbox1"> Checkbox 1
        <input type="checkbox" name="checkbox-group" value="checkbox2"> Checkbox 2
        <textarea id="comments" placeholder="Enter your comments here"></textarea>
        <button type="submit" id="submit">Submit</button>
    </form>
</body>
</html>
