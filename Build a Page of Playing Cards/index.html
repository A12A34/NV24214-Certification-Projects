<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Playing Cards</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1 id="title">A Small Deck</h1>
    <main id="playing-cards">
        <div class="card">
            <div class="left">♠</div>
            <div class="middle">
                <div class="rank">A</div>
            </div>
            <div class="right">♠</div>
        </div>

        <div class="card">
            <div class="left">♥</div>
            <div class="middle">
                <div class="rank">10</div>
            </div>
            <div class="right">♥</div>
        </div>

        <div class="card">
            <div class="left">♦</div>
            <div class="middle">
                <div class="rank">K</div>
            </div>
            <div class="right">♦</div>
        </div>
    </main>
</body>
</html>
